# Courses grouped by institution (most recent first).
# Optional course fields: designed: true (course I designed), note: e.g. "scheduled Spring 2027"
- institution: MCLA
  role: Instructor
  years: 2026 - Present
  courses:
  - code: MATH 250
    title: Discrete Mathematics
    description: >-
      Provides a foundation in mathematical topics central to the study of computer science, emphasizing
      mathematical reasoning and algorithms. Topics include propositional logic, Boolean algebra, mathematical
      proofs and induction, computer arithmetic, elementary combinatorics, recursion, graphs and trees,
      matrices, sequences and summation.
  - code: DATA 350
    title: Practicing Data Science
    note: scheduled Spring 2027
    description: >-
      Introduces students to data science as it is applied to various fields. Students will write computer
      programs to visualize and analyze large data sets, and to carry out various tests involving statistical
      inference. Required computer programming laboratory.
  - code: CSCI 101
    title: First Year Computer Science Seminar
    description: >-
      Introduces students to the skills needed to navigate the computer science concentrations. In addition,
      Computer Science majors are introduced to various topics used throughout the curriculum. Topics
      include computer hardware, operating systems, file types, protocols, and networking.
  - code: CSCI 121
    title: Programming in Java I
    note: scheduled Spring 2027
    description: >-
      Introduces the concepts of program development using the Java programming language. Topics include
      variables, control structures, arrays, string manipulation and an introduction to object oriented
      concepts.
  - code: CSCI 122
    title: Programming in Java II
    description: >-
      Continues the study of object oriented programming and the Java language. Topics include file manipulation,
      method and class definitions, graphic applications, applets, multimedia, events and interfaces.
  - code: CSCI 236
    title: Web Development
    note: scheduled Spring 2027
    description: >-
      Emphasizes the client side tools and techniques used to develop web applications. Topics include
      Java Script, XHTML, cascading style sheets, file transfer protocol and browser compatibility. The
      course will also discuss effective web page design considerations, including usability, accessibility
      and information design.
  - code: CSCI 390
    title: Junior Seminar
    note: scheduled Spring 2027
    description: >-
      Ensures that students are prepared for their senior year of study in Computer Science. Students
      attend class for one hour each week to review material from the lower level courses in the program,
      (100 and 200 level). Near the end of the semester, each student will take a multi-part exam, which
      must be passed to continue on.
- institution: Williams College
  role: Instructor
  years: 2025-2026
  courses:
  - code: CSCI 317
    title: Foundations of Computational Neuroscience
    designed: true
    description: >-
      How does the brain process information? Despite the continuous scientific pursuits to understand
      the brain, many questions about brain function remain unanswered. In this course, we take an interdisciplinary,
      hands-on approach to understanding the brain, focusing on how neural systems encode, transmit, and
      decode information. Students will learn foundational techniques in computational neuroscience as
      it pertains to simulating neuronal dynamics with canonical models such as the integrate-and-fire,
      Hodgkin-Huxley, and Wilson-Cowan equations, performing statistical analysis of neurological data,
      and examining biological neural networks and their parallels to artificial intelligence.
  - code: CSCI 104
    title: Data Science and Computing for All
    description: >-
      Many of the world’s greatest discoveries and most consequential decisions are enabled or informed
      by the analysis of data from a myriad of sources. Indeed, the ability to wrangle, visualize, and
      draw conclusions from data is now a critical tool in the sciences, business, medicine, politics,
      other academic disciplines, and society as a whole. This course lays the foundations for quantifying
      relationships in data by exploring complementary computational, statistical, and visualization concepts.
      These concepts will be reinforced by lab experiences designed to teach programming and statistics
      skills while analyzing real-world data sets. This course will also examine the broader context and
      social issues surrounding data analysis, including privacy and ethics.
- institution: University of Pittsburgh
  role: Instructor
  years: 2021-2022, Fall 2023
  courses:
  - code: MATH 0290
    title: Differential Equations
    description: >-
      This course presents an introduction to the theory of differential equations from an applied perspective.
      Topics include linear and nonlinear ordinary differential equations, Laplace transform, and introduction
      to partial differential equations.
  - code: MATH 0220
    title: Analytic Geometry and Calculus I
    description: >-
      This is the first of a sequence of three basic calculus courses. It covers the derivative and integral
      of functions of one variable and their applications.
  - code: MATH 0125
    title: Calculus for Business I
    description: >-
      This is the first half of a two course sequence (0125-0126). It will cover concepts such as limits,
      continuity, differentiation and integration. Maximization and minimization of functions will also
      be covered, with emphasis placed on applications in the social sciences, especially business and
      economics.
- institution: University of New Hampshire
  role: Teaching Assistant
  years: 2016-2021
  courses:
  - code: PHYS 408H
    title: Honors/General Physics II
    description: >-
      Introductory course emphasizing waves, sound, heat, electricity and magnetism. Recommended for students
      specializing in science and engineering. The honors version covers the same material as the traditional
      lecture course, but with three two-hour classes per week, most of which is spent working on activities
      in groups (rather than lecture). Students in the Honors section must be co-enrolled in MATH 426H
      so that strong connections can be made between math and physics. 408H students work in groups in
      every class meeting. Students in this version do not register for a recitation or lab, since these
      activities are integrated into the regular class meetings. Lab.
  - code: PHYS 407S
    title: General Physics I Studio
    description: >-
      Introductory course emphasizing motion, forces, energy, momentum, rotation, and oscillations. Recommended
      for the student specializing in science and engineering. The Studio version covers the same material
      as the traditional lecture course, but with three two-hour classes per week, most of which is spent
      working on activities in groups (rather than lecture). Students in this version do not register
      for a recitation or lab since these activities are integrated into the regular class meetings. Prereq:
      thorough knowledge of algebra, geometry, and trigonometry. Lab.
  - code: PHYS 407
    title: General Physics I
    description: >-
      Introductory course emphasizing motion, forces, energy, momentum, rotation, and oscillations. Recommended
      for the student specializing in science and engineering. This version is the traditional format
      with three lectures, one recitation (problem solving section), and one lab each week. Students in
      this version must also register for a particular recitation and lab. Prereq: thorough knowledge
      of algebra, geometry, and trigonometry. Lab.
  - code: PHYS 402
    title: Introduction to Physics II
    description: >-
      Broad survey of classical and modern physics. Designed to enable students to appreciate the role
      of physics in today's society and technology. Emphasizes the fundamental laws of nature on which
      all science is based, with some examples of interest to biologists. Knowledge of high school algebra,
      geometry, and trigonometry essential. Lab.
  - code: PHYS 401
    title: Introduction to Physics I
    description: >-
      Broad survey of classical and modern physics. Designed to enable students to appreciate the role
      of physics in today's society and technology. Emphasizes the fundamental laws of nature on which
      all science is based, with some examples of interest to biologists. Knowledge of high school algebra,
      geometry, and trigonometry essential. Lab.
